<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moving Logo Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
    }

    .header {
      background: #282c36;
      color: white;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
    }

    .ticket {
      padding: 25px;
    }

    .logo-area {
      width: 100%;
      height: 70px;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid #ccc;
      margin-bottom: 30px;
    }

    .moving-logo {
      position: absolute;
      top: 15px;
      font-weight: bold;
      font-size: 22px;
      background: orange;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      animation: moveLogo 3s infinite alternate ease-in-out;
    }

    @keyframes moveLogo {
      from {
        left: 10px;
      }
      to {
        left: calc(100% - 180px);
      }
    }

    .content {
      font-size: 24px;
      line-height: 1.5;
    }

    .name {
      font-size: 28px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="header">My Demo Travel App</div>

  <div class="ticket">
    <div class="logo-area">
      <div class="moving-logo">My Logo</div>
    </div>

    <div class="content">
      <div class="name">Bhargavsinh Solanki</div>
      <strong>Demo Ticket</strong><br>
      Personal animation example<br>
      Not a valid transport ticket
    </div>
  </div>

</body>
</html>
